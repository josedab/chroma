{{if .Values.compactionService.configuration}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: compaction-service-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
{{ .Values.compactionService.configuration | indent 4 }}
---
{{ end }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: compaction-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.compactionService.replicaCount }}
  selector:
    matchLabels:
      app: compaction-service
  template:
    metadata:
      labels:
        app: compaction-service
        member-type: compaction-service
    spec:
      serviceAccountName: compaction-service-serviceaccount
      volumes:
        {{if .Values.compactionService.configuration}}
        - name: compaction-service-config
          configMap:
            name: compaction-service-config
        {{ end }}
        {{if .Values.compactionService.cache}}
        - name: compaction-service-cache
          hostPath:
            path: {{ .Values.compactionService.cache.hostPath }}
            type: DirectoryOrCreate
        {{ end }}
      containers:
        - name: compaction-service
          image: "{{ .Values.compactionService.image.repository }}:{{ .Values.compactionService.image.tag }}"
          imagePullPolicy: IfNotPresent
          readinessProbe:
            periodSeconds: 1
            failureThreshold: 30 # 30 seconds to allow for initial startup
            grpc:
              port: 50051
          volumeMounts:
            {{if .Values.compactionService.configuration}}
            - name: compaction-service-config
              mountPath: /config/
            {{ end }}
            {{if .Values.compactionService.cache}}
            - name: compaction-service-cache
              mountPath: {{ .Values.compactionService.cache.mountPath }}
            {{ end }}
          ports:
            - containerPort: 50051
            - containerPort: 6060
              protocol: TCP
              name: pprof
          env:
            {{if .Values.compactionService.configuration}}
            - name: CONFIG_PATH
              value: /config/config.yaml
            {{ end }}
            # Automatic compaction configuration
            {{ if .Values.compactionService.automaticCompaction }}
            {{ if .Values.compactionService.automaticCompaction.enabled }}
            - name: CHROMA_COMPACTION_ENABLED
              value: "{{ .Values.compactionService.automaticCompaction.enabled }}"
            {{ end }}
            {{ if .Values.compactionService.automaticCompaction.schedule }}
            - name: CHROMA_COMPACTION_SCHEDULE
              value: "{{ .Values.compactionService.automaticCompaction.schedule }}"
            {{ end }}
            {{ if .Values.compactionService.automaticCompaction.sizeThresholdGb }}
            - name: CHROMA_COMPACTION_SIZE_THRESHOLD_GB
              value: "{{ .Values.compactionService.automaticCompaction.sizeThresholdGb }}"
            {{ end }}
            {{ if .Values.compactionService.automaticCompaction.fragmentationThreshold }}
            - name: CHROMA_COMPACTION_FRAGMENTATION_THRESHOLD
              value: "{{ .Values.compactionService.automaticCompaction.fragmentationThreshold }}"
            {{ end }}
            {{ if .Values.compactionService.automaticCompaction.deletedThreshold }}
            - name: CHROMA_COMPACTION_DELETED_THRESHOLD
              value: "{{ .Values.compactionService.automaticCompaction.deletedThreshold }}"
            {{ end }}
            {{ if .Values.compactionService.automaticCompaction.idleDays }}
            - name: CHROMA_COMPACTION_IDLE_DAYS
              value: "{{ .Values.compactionService.automaticCompaction.idleDays }}"
            {{ end }}
            {{ if .Values.compactionService.automaticCompaction.checkIntervalSeconds }}
            - name: CHROMA_COMPACTION_CHECK_INTERVAL_SECONDS
              value: "{{ .Values.compactionService.automaticCompaction.checkIntervalSeconds }}"
            {{ end }}
            {{ if .Values.compactionService.automaticCompaction.maxConcurrent }}
            - name: CHROMA_COMPACTION_MAX_CONCURRENT
              value: "{{ .Values.compactionService.automaticCompaction.maxConcurrent }}"
            {{ end }}
            {{ end }}
            {{ range .Values.compactionService.env }}
            - name: {{ .name }}
              # TODO properly use flow control here to check which type of value we need.
{{ .value | nindent 14 }}
            {{ end }}
            {{ if .Values.compactionService.jemallocConfig }}
            - name: _RJEM_MALLOC_CONF
              value: {{ .Values.compactionService.jemallocConfig }}
            {{ end }}
            - name: CHROMA_COMPACTION_SERVICE__MY_MEMBER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{ if .Values.compactionService.resources }}
          resources:
            limits:
              cpu: {{ .Values.compactionService.resources.limits.cpu }}
              memory: {{ .Values.compactionService.resources.limits.memory }}
            requests:
              cpu: {{ .Values.compactionService.resources.requests.cpu }}
              memory: {{ .Values.compactionService.resources.requests.memory }}
          {{ end }}
      {{if .Values.compactionService.tolerations}}
      tolerations:
        {{ toYaml .Values.compactionService.tolerations | nindent 8 }}
      {{ end }}
      {{if .Values.compactionService.nodeSelector}}
      nodeSelector:
        {{ toYaml .Values.compactionService.nodeSelector | nindent 8 }}
      {{ end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              member-type: compaction-service

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: compaction-service-serviceaccount
  namespace: {{ .Values.namespace }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compaction-service-serviceaccount-rolebinding
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-watcher
subjects:
- kind: ServiceAccount
  name: compaction-service-serviceaccount
  namespace: {{ .Values.namespace }}

---
